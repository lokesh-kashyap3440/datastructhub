<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="Interactive Data Structures Visualizer">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0f'/><text x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' fill='%2300e5ff' text-anchor='middle'>DS</text></svg>">
    <title>DataStructHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">

        <!-- Sidebar (→ bottom tab bar on mobile via responsive.css) -->
        <aside class="sidebar" id="tabBar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">Data<span class="logo-accent">Struct</span>Hub</span>
                </div>
            </div>
            <nav class="nav-list">
                <button class="nav-item active" data-structure="array">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                        </svg>
                    </span>
                    <span class="nav-label">Array</span>
                    <span class="nav-color-dot" style="background:#00e5ff"></span>
                </button>
                <button class="nav-item" data-structure="linkedlist">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="12" r="3"/>
                            <line x1="9" y1="12" x2="15" y2="12"/>
                        </svg>
                    </span>
                    <span class="nav-label">List</span>
                    <span class="nav-color-dot" style="background:#ff0080"></span>
                </button>
                <button class="nav-item" data-structure="stack">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="4" y="4" width="16" height="6" rx="1"/>
                            <rect x="4" y="11" width="16" height="6" rx="1"/>
                            <rect x="4" y="18" width="16" height="6" rx="1" opacity="0.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">Stack</span>
                    <span class="nav-color-dot" style="background:#ff6b00"></span>
                </button>
                <button class="nav-item" data-structure="queue">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="8" width="5" height="8" rx="1"/>
                            <rect x="10" y="8" width="5" height="8" rx="1"/>
                            <rect x="17" y="8" width="5" height="8" rx="1" opacity="0.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">Queue</span>
                    <span class="nav-color-dot" style="background:#ffd600"></span>
                </button>
                <button class="nav-item" data-structure="bst">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="5" r="2.5"/>
                            <circle cx="6" cy="17" r="2.5"/>
                            <circle cx="18" cy="17" r="2.5"/>
                            <line x1="12" y1="7.5" x2="6" y2="14.5"/>
                            <line x1="12" y1="7.5" x2="18" y2="14.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">BST</span>
                    <span class="nav-color-dot" style="background:#00ff88"></span>
                </button>
                <button class="nav-item" data-structure="hashtable">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="6" rx="1"/>
                            <rect x="3" y="10" width="18" height="6" rx="1"/>
                            <line x1="7" y1="3" x2="7" y2="9"/>
                            <line x1="7" y1="10" x2="7" y2="16"/>
                        </svg>
                    </span>
                    <span class="nav-label">Hash</span>
                    <span class="nav-color-dot" style="background:#9b59ff"></span>
                </button>
                <button class="nav-item" data-structure="graph">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
                            <circle cx="12" cy="18" r="2"/>
                            <line x1="8" y1="6" x2="16" y2="6"/>
                            <line x1="16.5" y1="7" x2="13.5" y2="16.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">Graph</span>
                    <span class="nav-color-dot" style="background:#ff3d71"></span>
                </button>
                <button class="nav-item" data-structure="heap">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="4" r="2"/>
                            <circle cx="6" cy="14" r="2"/><circle cx="18" cy="14" r="2"/>
                            <line x1="12" y1="6" x2="6" y2="12"/>
                            <line x1="12" y1="6" x2="18" y2="12"/>
                        </svg>
                    </span>
                    <span class="nav-label">Heap</span>
                    <span class="nav-color-dot" style="background:#14f195"></span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar" id="topBar">
                <div class="structure-info">
                    <h1 class="structure-title" id="structureTitle">Array</h1>
                    <p class="structure-desc" id="structureDesc">Select a data structure to begin</p>
                </div>
                <div class="structure-stats">
                    <div class="stat">
                        <span class="stat-label">Size</span>
                        <span class="stat-value" id="statSize">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Capacity</span>
                        <span class="stat-value" id="statCapacity">12</span>
                    </div>
                </div>
            </header>

            <div class="canvas-wrapper" id="canvasArea">
                <div class="visualization" id="visualization">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">📦</div>
                        <div class="empty-title">Structure is empty</div>
                        <div class="empty-hint">Add elements to visualize</div>
                    </div>
                </div>
            </div>

            <div class="control-panel" id="controlPanel">
                <div class="control-input-group">
                    <input type="text" class="control-input" id="valueInput" placeholder="Value" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <select class="control-select" id="operationSelect">
                        <option value="insert">Insert</option>
                        <option value="insertAt">Insert At</option>
                        <option value="delete">Delete</option>
                        <option value="deleteAt">Delete At</option>
                        <option value="search">Search</option>
                        <option value="update">Update</option>
                    </select>
                    <input type="number" class="control-input index-input" id="indexInput" placeholder="Idx" style="display:none" autocomplete="off">
                </div>
                <div class="control-buttons">
                    <button class="btn btn-primary" id="executeBtn">Execute</button>
                    <button class="btn btn-secondary" id="randomBtn">🎲</button>
                    <button class="btn btn-danger" id="clearBtn">✕</button>
                    <button class="btn btn-secondary" id="soundBtn" title="Sound">🔊</button>
                </div>
            </div>
        </main>

        <!-- Metrics Panel -->
        <aside class="metrics-panel" id="complexityBar">
            <div class="metric-section">
                <h3 class="metric-title"><span class="metric-icon">📊</span> Time Complexity</h3>
                <div id="compBars"></div>
            </div>
            <div class="metric-section">
                <h3 class="metric-title"><span class="metric-icon">💾</span> Space Complexity</h3>
                <div class="space-complexity">
                    <span class="complexity-badge" id="spaceBadge">O(n)</span>
                </div>
            </div>
            <div class="metric-section">
                <h3 class="metric-title"><span class="metric-icon">📋</span> Operation Log</h3>
                <div class="operation-log" id="operationLog"></div>
            </div>
        </aside>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Vite entry point (ES module) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
