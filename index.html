<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="Interactive Data Structures Visualizer">
    <title>DataStructHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <!-- Top Bar -->
    <header id="topBar">
        <div id="structureTitle">Array</div>
        <div id="structureStats">
            <span id="statSize">0</span>
            <span id="statSeparator">/</span>
            <span id="statCapacity">12</span>
        </div>
    </header>

    <!-- Tab Bar (was sidebar) -->
    <nav id="tabBar">
        <button class="tab active" data-structure="array">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                    <line x1="15" y1="3" x2="15" y2="21"/>
                </svg>
            </span>
            <span class="tabLabel">Array</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="linkedlist">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="12" r="3"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                </svg>
            </span>
            <span class="tabLabel">List</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="stack">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="6" rx="1"/>
                    <rect x="4" y="11" width="16" height="6" rx="1"/>
                    <rect x="4" y="18" width="16" height="6" rx="1" opacity="0.5"/>
                </svg>
            </span>
            <span class="tabLabel">Stack</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="queue">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="8" width="5" height="8" rx="1"/>
                    <rect x="10" y="8" width="5" height="8" rx="1"/>
                    <rect x="17" y="8" width="5" height="8" rx="1" opacity="0.5"/>
                </svg>
            </span>
            <span class="tabLabel">Queue</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="bst">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="5" r="2.5"/>
                    <circle cx="6" cy="17" r="2.5"/>
                    <circle cx="18" cy="17" r="2.5"/>
                    <line x1="12" y1="7.5" x2="6" y2="14.5"/>
                    <line x1="12" y1="7.5" x2="18" y2="14.5"/>
                </svg>
            </span>
            <span class="tabLabel">BST</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="hashtable">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="6" rx="1"/>
                    <rect x="3" y="10" width="18" height="6" rx="1"/>
                    <line x1="7" y1="3" x2="7" y2="9"/>
                    <line x1="7" y1="10" x2="7" y2="16"/>
                </svg>
            </span>
            <span class="tabLabel">Hash</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="graph">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
                    <circle cx="12" cy="18" r="2"/>
                    <line x1="8" y1="6" x2="16" y2="6"/>
                    <line x1="16.5" y1="7" x2="13.5" y2="16.5"/>
                </svg>
            </span>
            <span class="tabLabel">Graph</span>
            <span class="tabDot"></span>
        </button>
        <button class="tab" data-structure="heap">
            <span class="tabIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="4" r="2"/>
                    <circle cx="6" cy="14" r="2"/><circle cx="18" cy="14" r="2"/>
                    <line x1="12" y1="6" x2="6" y2="12"/>
                    <line x1="12" y1="6" x2="18" y2="12"/>
                </svg>
            </span>
            <span class="tabLabel">Heap</span>
            <span class="tabDot"></span>
        </button>
    </nav>

    <!-- Visualization Canvas -->
    <main id="canvasArea">
        <div id="visualization">
            <div id="emptyState">
                <div class="emptyIcon">📦</div>
                <div class="emptyTitle">Structure is empty</div>
                <div class="emptyHint">Add elements to visualize</div>
            </div>
        </div>
    </main>

    <!-- Control Panel -->
    <footer id="controlPanel">
        <div id="inputRow">
            <input type="text" id="valueInput" placeholder="Value" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <select id="operationSelect">
                <option value="insert">Insert</option>
                <option value="insertAt">Insert At</option>
                <option value="delete">Delete</option>
                <option value="deleteAt">Delete At</option>
                <option value="search">Search</option>
                <option value="update">Update</option>
            </select>
            <input type="number" id="indexInput" placeholder="Idx" style="display:none" autocomplete="off">
        </div>
        <div id="buttonRow">
            <button class="actionBtn primary" id="executeBtn">Execute</button>
            <button class="actionBtn secondary" id="randomBtn">🎲</button>
            <button class="actionBtn danger" id="clearBtn">✕</button>
            <button class="actionBtn icon" id="soundBtn" title="Sound">🔊</button>
        </div>
    </footer>

    <!-- Complexity Bar -->
    <div id="complexityBar">
        <div id="compLabel">Time Complexity</div>
        <div id="compBars">
            <div class="compOp">
                <span class="compName">Acc</span>
                <div class="compBar" data-value="1"></div>
            </div>
            <div class="compOp">
                <span class="compName">Sea</span>
                <div class="compBar" data-value="3"></div>
            </div>
            <div class="compOp">
                <span class="compName">Ins</span>
                <div class="compBar" data-value="3"></div>
            </div>
            <div class="compOp">
                <span class="compName">Del</span>
                <div class="compBar" data-value="3"></div>
            </div>
        </div>
        <div id="spaceBadge">O(n)</div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Background Effects -->
    <div id="bgGrid"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/core/EventBus.js"></script>
    <script src="js/core/Animator.js"></script>
    <script src="js/core/SoundEngine.js"></script>
    <script src="js/core/ChartManager.js"></script>
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/structures/ArrayDS.js"></script>
    <script src="js/structures/LinkedList.js"></script>
    <script src="js/structures/Stack.js"></script>
    <script src="js/structures/Queue.js"></script>
    <script src="js/structures/BST.js"></script>
    <script src="js/structures/HashTable.js"></script>
    <script src="js/structures/Graph.js"></script>
    <script src="js/structures/Heap.js"></script>
</body>
</html>
